[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rulemine"
version = "0.1.0"
description = "Mine local agent transcripts for rules, decisions, and portable skills using local Gemma."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RuleMine Contributors", email = "contributors@rulemine.local" }
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
rulemine = "rulemine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
